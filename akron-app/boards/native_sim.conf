# Native simulator settings
# Keep Wi-Fi and credential storage in hardware board configs.

# Use host-backed NSOS networking instead of TAP/zeth.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# Match hardware connectivity APIs and events.
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_CONNECTIVITY_SIM=y

# NSOS lacks the interface access required for IPv6 DAD.
CONFIG_NET_IPV6_DAD=n

# Assign a cosmetic IP so conn_mgr reports L4 connectivity immediately.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# NSOS has no L2 for DHCP; the static address satisfies conn_mgr.
CONFIG_NET_DHCPV4=n

# Use wall-clock timing for network requests.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
