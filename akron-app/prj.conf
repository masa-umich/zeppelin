# Settings shared by hardware and native_sim; board-specific options go in boards/.

# Settings
CONFIG_SETTINGS=y

# GPIO
CONFIG_GPIO=y

# Logging
CONFIG_LOG=y

# Console
CONFIG_SHELL=y

# Memory
# Xtensa requires larger stacks; smaller values caused memory corruption.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
# The previous 2048-byte network RX stack overflowed.
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=3072

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_ETHERNET=y

## Hostname
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="zeppelin"

## Connection Manager configuration
CONFIG_NET_CONNECTION_MANAGER=y
# ESP32 high-water mark is ~1.9 kB; the 512-byte default overflowed.
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=2560
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

## SNTP time sync
CONFIG_SNTP=y
