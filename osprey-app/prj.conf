# Networking and platform APIs required by open62541's Zephyr backend.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PICOLIBC=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_XSI_SINGLE_PROCESS=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_INTERFACE_NAME=y
CONFIG_EVENTFD=y
CONFIG_LOG=y
CONFIG_GPIO=y

# Bound the server's stack and libc heap rather than consuming all free SRAM.
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=98304
CONFIG_HEAP_MEM_POOL_SIZE=1024

# IP config
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y

# Link-local address
CONFIG_NET_CONFIG_MY_IPV4_ADDR="169.254.0.50"
# Generic address
# CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.50"

CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

CONFIG_NET_DHCPV4=n
CONFIG_NET_CONNECTION_MANAGER=y

# Small server feature set, following the upstream Zephyr server example.
CONFIG_OPEN62541=y
CONFIG_OPEN62541_MULTITHREADING=0
CONFIG_OPEN62541_NAMESPACE_ZERO="MINIMAL"
CONFIG_OPEN62541_ENABLE_DISCOVERY_SEMAPHORE=n
CONFIG_OPEN62541_ENABLE_PUBSUB=n
CONFIG_OPEN62541_ENABLE_PUBSUB_INFORMATIONMODEL=n
CONFIG_OPEN62541_ENABLE_SUBSCRIPTIONS_EVENTS=n
CONFIG_OPEN62541_ENABLE_SUBSCRIPTIONS=n
CONFIG_OPEN62541_ENABLE_HISTORIZING=n
CONFIG_OPEN62541_ENABLE_JSON_ENCODING=n
CONFIG_OPEN62541_ENABLE_DIAGNOSTICS=n
CONFIG_OPEN62541_ENABLE_METHODCALLS=n
CONFIG_OPEN62541_ENABLE_DA=n
CONFIG_OPEN62541_ENABLE_DISCOVERY=n
CONFIG_OPEN62541_ENABLE_DATATYPES_ALL=n
CONFIG_OPEN62541_ENABLE_NODEMANAGEMENT=n
CONFIG_OPEN62541_ENABLE_DEBUG_SANITIZER=n
CONFIG_OPEN62541_ENABLE_TYPEDESCRIPTION=y
CONFIG_OPEN62541_ENABLE_NODESET_COMPILER_DESCRIPTIONS=n
