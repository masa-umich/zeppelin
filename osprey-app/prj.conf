# Networking and platform APIs required by open62541's Zephyr backend.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PICOLIBC=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_XSI_SINGLE_PROCESS=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_INTERFACE_NAME=y
CONFIG_EVENTFD=y
CONFIG_LOG=y

# Server startup needs more than Zephyr's default 1 KiB main stack.
CONFIG_MAIN_STACK_SIZE=4096
# open62541 uses the kernel heap; match the upstream Zephyr example's budget. Feel free to increase this in the future.
CONFIG_HEAP_MEM_POOL_SIZE=200000
# select() needs the wakeup eventfd, listening socket, and six client sockets.
CONFIG_ZVFS_POLL_MAX=8
# Six clients plus the listener, with one spare network context for reconnects.
CONFIG_NET_MAX_CONTEXTS=8

# IP config
CONFIG_NET_CONFIG_SETTINGS=y

# Link-local address
CONFIG_NET_CONFIG_MY_IPV4_ADDR="169.254.0.50"

CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.0.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="0.0.0.0"

# Small server feature set, following the upstream Zephyr server example.
CONFIG_OPEN62541=y
CONFIG_OPEN62541_NAMESPACE_ZERO="MINIMAL"
CONFIG_OPEN62541_ENABLE_DISCOVERY_SEMAPHORE=n
CONFIG_OPEN62541_ENABLE_PUBSUB=n
CONFIG_OPEN62541_ENABLE_PUBSUB_INFORMATIONMODEL=n
CONFIG_OPEN62541_ENABLE_SUBSCRIPTIONS_EVENTS=n
CONFIG_OPEN62541_ENABLE_SUBSCRIPTIONS=n
CONFIG_OPEN62541_ENABLE_HISTORIZING=n
CONFIG_OPEN62541_ENABLE_JSON_ENCODING=n
